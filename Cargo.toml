[workspace]
resolver = "2"
members = [
    "crates/zashu-core",
    "crates/zashu-acc",
    "crates/zashu-circuits",
    "crates/zashu-mint",
    "crates/zashu-cdk-sidecar",
    "crates/zashu-auditor",
    "crates/zashu-wallet",
]

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
bitcoin = { version = "0.32", features = ["rand-std"] }
blake2b_simd = "1"
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive"] }
ff = "0.14"
group = "0.14"
halo2_poseidon = "0.2"
halo2_proofs = "0.4"
hex = "0.4"
pasta_curves = "0.6"
proptest = "1.6"
rand = "0.10"
rand_core = "0.10"
rayon = "1.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
secp256k1 = { version = "0.29", features = ["rand-std", "global-context"] }
serde = { version = "1.0", features = ["derive"] }
serde_cbor = "0.11"
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

zashu-core = { path = "crates/zashu-core" }
zashu-acc = { path = "crates/zashu-acc" }
zashu-circuits = { path = "crates/zashu-circuits" }
zashu-mint = { path = "crates/zashu-mint" }
zashu-cdk-sidecar = { path = "crates/zashu-cdk-sidecar" }
zashu-auditor = { path = "crates/zashu-auditor" }
zashu-wallet = { path = "crates/zashu-wallet" }
