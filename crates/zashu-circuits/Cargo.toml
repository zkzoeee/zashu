[package]
name = "zashu-circuits"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
base64.workspace = true
blake2b_simd.workspace = true
ff.workspace = true
group.workspace = true
halo2_poseidon.workspace = true
halo2_proofs.workspace = true
pasta_curves.workspace = true
rand.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zashu-acc.workspace = true
zashu-core.workspace = true
# Ragu PCD backend, compiled in by default and selected at runtime. Unreleased and still being audited upstream
# (crates.io only has 0.0.0 placeholders), so it is pinned to a commit.
ragu = { git = "https://github.com/tachyon-zcash/ragu", rev = "a812865ff7aa8c2d546c7019f0a822ea8c1aa5a9", features = ["baked"], optional = true }

[features]
default = ["ragu"]
# The Ragu backends (`mode_a::ragu_backend`, `mode_b::ragu_backend`), selected
# with `ZASHU_PCD_BACKEND=ragu`. Build with `--no-default-features` to leave
# them out.
ragu = ["dep:ragu"]

[dev-dependencies]
proptest.workspace = true
